# Browser files shipped inside the package, so the UI works with no internet.
#
# Each path is relative to this directory. To update one: change its version
# below, run `just vendor`, and commit the files with the new hashes it writes
# here. Never edit a vendored file; style and behaviour of our own go in
# ../app.css and ../app.js. The tests check every file still matches its
# sha256, and the About page lists what is here. See VENDORED.md.

[[file]]
package = "bootstrap"
version = "5.3.8"
licence = "MIT"
url = "https://cdn.jsdelivr.net/npm/bootstrap@{version}/dist/css/bootstrap.min.css"
path = "bootstrap.min.css"
sha256 = "d85327d99c7a3ee1f9b5d0500d1370acea3ad2db39c163c2f51f232baedbdede"

