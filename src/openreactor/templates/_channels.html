{% if channels %}
<table class="table table-sm align-middle">
  <thead><tr><th>Channel</th><th class="text-end">Value</th><th>Unit</th><th>State</th></tr></thead>
  <tbody>
    {% for c in channels %}
    <tr>
      <td>{{ c.name }}</td>
      <td class="text-end font-monospace">{{ "%.4g"|format(c.value) if c.value is not none else "—" }}</td>
      <td>{{ c.unit }}</td>
      <td>{% if c.outcome == "ok" %}<span class="text-success">ok</span>{% else %}<span class="text-danger">{{ c.outcome }}</span>{% endif %}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-body-secondary">No readings yet.</p>
{% endif %}
