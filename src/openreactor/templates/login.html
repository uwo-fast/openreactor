{% extends "base.html" %}
{% block title %}Sign in · openreactor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <form class="col-sm-8 col-md-5" method="post" action="/login">
    <h1 class="h4 mb-3">Sign in</h1>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
