[project]
name = "openreactor"
version = "2.0.0a1"
description = "Supervise benchtop lab reactors from a Raspberry Pi: temperature, mixing, dosing and water chemistry, with recorded runs."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "FAST Research Group" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 0.x: a minor release may break the API.
    "ezo-driver>=0.6,<0.7",
    # Capped at the next minor (FastAPI) or major (Starlette, pydantic):
    # their breaking changes land there.
    "fastapi>=0.142,<0.143",
    "starlette>=1.7,<2",
    "pydantic>=2.13,<3",
    "uvicorn>=0.54,<0.55",
    "itsdangerous>=2.2,<3",
]

[project.scripts]
openreactor = "openreactor.cli:main"

[project.urls]
Homepage = "https://github.com/uwo-fast/openreactor"
Issues = "https://github.com/uwo-fast/openreactor/issues"
Changelog = "https://github.com/uwo-fast/openreactor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # Starlette's TestClient; plain httpx is deprecated there.
    "httpx2>=2.13",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Keep in step with build-system.requires. CI's setup-uv installs the newest
# uv in this range, so the release build uses a backend inside the pin.
required-version = ">=0.11,<0.13"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
